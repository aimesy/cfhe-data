name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install --disable-pip-version-check -e ".[dev]"
      - name: Test
        run: python -m pytest -q
      - name: Lint
        run: python -m ruff check src tests
      - name: Format check
        run: python -m ruff format --check src tests
      - name: Compile
        run: python -m compileall -q src tests

  publish-airtable:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: airtable-production
    concurrency:
      group: airtable-production
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Confirm this commit is still master
        shell: bash
        run: |
          git fetch --no-tags origin +refs/heads/master:refs/remotes/origin/master
          test "$(git rev-parse origin/master)" = "$GITHUB_SHA"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install --disable-pip-version-check -e .
      - name: Publish reviewed permit totals to Airtable
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
        shell: bash
        run: |
          git fetch --no-tags origin +refs/heads/master:refs/remotes/origin/master
          test "$(git rev-parse origin/master)" = "$GITHUB_SHA"
          cfhe-data airtable-sync \
            --totals data/processed/airtable_totals.json \
            --config config/airtable_sync.json \
            --cycle-policy config/airtable_cycles.json \
            --git-sha "$GITHUB_SHA" \
            --apply
