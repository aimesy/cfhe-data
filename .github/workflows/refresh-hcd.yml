name: Refresh HCD data

on:
  workflow_dispatch:
    inputs:
      cutoff_year:
        description: Last permit year to include
        required: false
  schedule:
    - cron: "37 15 * * 5"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: refresh-hcd
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: master
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install --disable-pip-version-check -e ".[dev]"
      - name: Determine latest complete reporting year
        id: cutoff
        shell: bash
        env:
          REQUESTED_CUTOFF: ${{ inputs.cutoff_year }}
        run: |
          if [[ -n "$REQUESTED_CUTOFF" ]]; then
            cutoff_year="$REQUESTED_CUTOFF"
          else
            current_year="$(date -u +%Y)"
            month_day="$(date -u +%m%d)"
            if (( 10#$month_day > 630 )); then
              cutoff_year="$((current_year - 1))"
            else
              cutoff_year="$((current_year - 2))"
            fi
          fi
          echo "year=$cutoff_year" >> "$GITHUB_OUTPUT"
      - name: Fetch and build
        run: >-
          cfhe-data refresh
          --sources config/sources.toml
          --raw-dir data/raw
          --output-dir data/processed
          --audit-dir data/run
          --cutoff-year "${{ steps.cutoff.outputs.year }}"
      - name: Verify
        run: |
          python -m pytest -q
          python -m ruff check src tests
          python -m ruff format --check src tests
          python -m compileall -q src tests
      - name: Upload deduplication review evidence
        uses: actions/upload-artifact@v4
        with:
          name: deduplication-review-${{ github.run_id }}
          path: |
            data/run/dedupe_review.jsonl
            data/run/airtable_dedupe_review.jsonl
            data/processed/audit_summary.json
            data/processed/airtable_audit_summary.json
          if-no-files-found: error
          compression-level: 9
          retention-days: 90
      - name: Detect changes
        id: changes
        shell: bash
        run: |
          if [[ -z "$(git status --porcelain -- data/processed)" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Open draft refresh pull request
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="data-refresh/${GITHUB_RUN_ID}"
          review_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          body="Automated HCD source refresh. Review the source manifest, audit summaries, and jurisdiction changes before merging. Compact decision ledgers containing each removal plus every directly matched and final referenced row are attached to the workflow run at ${review_url}. Raw source rows and the complete local ledgers are not uploaded. This workflow does not publish directly. After merge, the protected Airtable job independently revalidates and publishes an eligible plan."
          git config user.name "cfhe-data bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add -- \
            data/processed/source_manifest.json \
            data/processed/jurisdiction_totals.csv \
            data/processed/jurisdiction_totals.json \
            data/processed/audit_summary.json \
            data/processed/airtable_totals.json \
            data/processed/airtable_audit_summary.json
          git commit -m "Refresh HCD APR data"
          git push origin "$branch"
          gh pr create \
            --draft \
            --base master \
            --head "$branch" \
            --title "Refresh HCD APR data" \
            --body "$body"
